<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-label="访问埋点后台管理系统 UI 方案图">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f7fb"/>
      <stop offset="0.55" stop-color="#eef3f8"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#173a5e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title{font:900 48px "PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a;letter-spacing:0}
      .subtitle{font:700 22px "PingFang SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .label{font:800 20px "PingFang SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .body{font:700 22px "PingFang SC","Microsoft YaHei",sans-serif;fill:#1e293b}
      .small{font:700 18px "PingFang SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .whiteTitle{font:900 32px "PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .whiteText{font:700 18px "PingFang SC","Microsoft YaHei",sans-serif;fill:#cbd5e1}
      .num{font:900 54px "DIN Alternate","Roboto Mono",monospace;fill:#0f172a}
      .red{fill:#dc2626}.green{fill:#059669}.blue{fill:#1e40af}.muted{fill:#64748b}
    </style>
  </defs>

  <rect width="1600" height="1180" fill="url(#pageBg)"/>

  <text x="90" y="92" class="title">用户访问埋点后台 UI 方案</text>
  <text x="92" y="132" class="subtitle">需求确认图：登录页 + 管理主页；确认后再进入开发</text>

  <rect x="90" y="178" width="620" height="820" rx="28" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="90" y="178" width="620" height="150" rx="28" fill="url(#navy)"/>
  <text x="132" y="246" class="whiteTitle">登录页</text>
  <text x="132" y="286" class="whiteText">单密码入口，适合个人后台快速查看访问量</text>

  <rect x="168" y="390" width="464" height="360" rx="22" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>
  <text x="214" y="456" class="body">后台管理系统</text>
  <text x="214" y="492" class="small">输入访问密码进入管理主页</text>
  <rect x="214" y="540" width="372" height="68" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="236" y="583" class="label">密码</text>
  <circle cx="424" cy="574" r="6" fill="#94a3b8"/>
  <circle cx="450" cy="574" r="6" fill="#94a3b8"/>
  <circle cx="476" cy="574" r="6" fill="#94a3b8"/>
  <circle cx="502" cy="574" r="6" fill="#94a3b8"/>
  <circle cx="528" cy="574" r="6" fill="#94a3b8"/>
  <rect x="214" y="638" width="372" height="64" rx="12" fill="#0f172a"/>
  <text x="356" y="679" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="900" fill="#fff">登录</text>

  <rect x="150" y="810" width="500" height="110" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="178" y="858" class="body">交互规则</text>
  <text x="178" y="894" class="small">密码正确进入；错误时在输入框下方提示</text>

  <rect x="790" y="178" width="720" height="820" rx="28" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="790" y="178" width="720" height="110" rx="28" fill="url(#navy)"/>
  <text x="832" y="246" class="whiteTitle">管理主页</text>
  <text x="1256" y="246" class="whiteText">/admin</text>

  <rect x="830" y="330" width="290" height="178" rx="20" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>
  <text x="862" y="380" class="label">总访问设备数</text>
  <text x="862" y="452" class="num">128</text>
  <text x="862" y="486" class="small">一个设备只计为一个客户访问</text>

  <rect x="1160" y="330" width="290" height="178" rx="20" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>
  <text x="1192" y="380" class="label">今日新增</text>
  <text x="1192" y="452" class="num">9</text>
  <text x="1192" y="486" class="small">按当天首次访问设备统计</text>

  <rect x="830" y="550" width="620" height="330" rx="20" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>
  <text x="862" y="604" class="body">用户访问列表</text>
  <text x="1192" y="604" class="small">只展示必要信息，避免过度收集</text>
  <line x1="862" y1="640" x2="1418" y2="640" stroke="#e2e8f0" stroke-width="2"/>
  <text x="862" y="682" class="label">设备 ID</text>
  <text x="1060" y="682" class="label">首次访问</text>
  <text x="1265" y="682" class="label">最近访问</text>
  <line x1="862" y1="708" x2="1418" y2="708" stroke="#e2e8f0" stroke-width="2"/>
  <text x="862" y="752" class="small">dev_8f23a1</text>
  <text x="1060" y="752" class="small">2026-06-02 09:12</text>
  <text x="1265" y="752" class="small">2026-06-02 21:08</text>
  <line x1="862" y1="778" x2="1418" y2="778" stroke="#eef2f7" stroke-width="2"/>
  <text x="862" y="822" class="small">dev_6b91c0</text>
  <text x="1060" y="822" class="small">2026-06-02 12:40</text>
  <text x="1265" y="822" class="small">2026-06-02 12:40</text>

  <rect x="830" y="910" width="620" height="58" rx="14" fill="#f8fafc" stroke="#d7dee8" stroke-width="2"/>
  <text x="862" y="947" class="small">建议口径：localStorage 生成设备 ID；服务端按 deviceId 去重统计。</text>

  <rect x="90" y="1040" width="1420" height="86" rx="20" fill="#0f172a"/>
  <text x="132" y="1092" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="900" fill="#fff">确认点：</text>
  <text x="232" y="1092" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#cbd5e1">是否接受这个后台结构：登录页只输入密码，管理主页先展示访问设备总数和简单设备访问列表。</text>
</svg>
