<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 900px; padding: 44px; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #eff7f1; color: #102033; }
    .card { overflow: hidden; border-radius: 22px; background: #fff; border: 1px solid #cfe5d7; box-shadow: 0 24px 70px rgba(22,82,52,.14); }
    header { padding: 34px 38px; background: linear-gradient(135deg, #063b2b, #0dbb68); color: #fff; }
    h1 { margin: 0; font-size: 48px; line-height: 1.18; }
    p { margin: 18px 0 0; color: rgba(255,255,255,.84); font-size: 24px; line-height: 1.55; font-weight: 800; }
    .body { display: grid; grid-template-columns: 1fr 310px; gap: 24px; padding: 32px; align-items: center; }
    .copy { color: #355064; font-size: 25px; line-height: 1.65; font-weight: 800; }
    .copy b { color: #0b6b43; }
    img { width: 310px; border-radius: 18px; border: 1px solid #dbe7df; box-shadow: 0 18px 46px rgba(16,74,45,.16); }
    .url { margin-top: 22px; padding: 18px; border-radius: 12px; background: #f2fbf5; color: #0b6b43; font-size: 24px; font-weight: 1000; }
  </style>
</head>
<body>
  <section class="card">
    <header>
      <h1>如果它帮到了你</h1>
      <p>这个项目是为爱发电：通宵写了几个晚上，Token、服务器和域名都是自己掏钱。</p>
    </header>
    <div class="body">
      <div class="copy">
        如果你愿意赞赏一下，会是对我继续维护这个工具很大的激励。<br><br>
        <b>不是强制，也不是卖服务。</b><br>
        只是感谢每一个愿意试用、反馈和支持的人。
        <div class="url">http://121.40.152.89</div>
      </div>
      <img src="assets/reward-code.jpg" alt="微信赞赏码">
    </div>
  </section>
</body>
</html>
