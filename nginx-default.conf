server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /srv/lof;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /data/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
    }
}
